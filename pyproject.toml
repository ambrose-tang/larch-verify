[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "larch-verify"
version = "0.2.0"
description = "Verification-guided development for everyday code: an LLM agent writes a Lean 4 model of each function, proves properties about it, and differentially tests your Python, JavaScript or TypeScript implementation against it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Larch contributors" }]
keywords = ["lean4", "formal-verification", "llm", "property-based-testing", "differential-testing", "mutation-testing", "typescript", "javascript", "python", "ci"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: JavaScript",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "anthropic>=0.40",
  "rich>=13.7",
  # Runs only in Larch's own interpreter (the test driver), never in the project's.
  "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/ambrose-tang/larch-verify"
Changelog = "https://github.com/ambrose-tang/larch-verify/blob/main/CHANGELOG.md"
Issues = "https://github.com/ambrose-tang/larch-verify/issues"

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]"]
vertex = ["anthropic[vertex]"]
dev = ["pytest>=8"]

[project.scripts]
larch = "larch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["larch"]

[tool.hatch.build.targets.sdist]
include = ["larch", "README.md", "DECISIONS.md", "EVALS.md", "CHANGELOG.md", "SECURITY.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
